  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6654c8"/><stop offset="1" stop-color="#251d67"/></linearGradient>
  <linearGradient id="slip" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7b4df4" stop-opacity=".2"/><stop offset=".5" stop-color="#60e7e5" stop-opacity=".95"/><stop offset="1" stop-color="#7b4df4" stop-opacity=".12"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="smallGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

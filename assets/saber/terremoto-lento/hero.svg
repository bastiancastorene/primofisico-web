<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Slow slip across a subduction interface</title>
<desc id="desc">A dark tectonic cross-section with a slow-slip front, tremor pulses and geodetic stations.</desc>
<defs>

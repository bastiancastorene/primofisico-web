<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">HIV, a molecular clock and an urban network</title>
  <desc id="desc">Abstract dark illustration of a viral particle, a branching genetic tree and connected cities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09061d"/><stop offset=".55" stop-color="#171048"/><stop offset="1" stop-color="#082d43"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#ff5edc" stop-opacity=".45"/><stop offset="1" stop-color="#ff5edc" stop-opacity="0"/></radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff65d7"/><stop offset=".52" stop-color="#8a6dff"/><stop offset="1" stop-color="#4ff5f1"/></linearGradient>
